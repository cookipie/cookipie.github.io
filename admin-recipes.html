<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookipie Recipe Manager</title><link rel="stylesheet" href="assets/css/style.css?v=9"><style>body{background:#f6f5ef;color:#173f32}.manager{max-width:900px;margin:32px auto;padding:20px}.panel{background:white;border:1px solid #e1e4dc;border-radius:18px;padding:20px;margin:16px 0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px}.fields input,.fields select,.fields textarea{width:100%;padding:11px;border:1px solid #d7ddd5;border-radius:9px;font:inherit}.wide{grid-column:1/-1}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.buttons button{padding:11px 16px;border:0;border-radius:24px;background:#173f32;color:#fff;font-weight:700}.buttons .secondary{background:#e8eee7;color:#173f32}.recipe-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e4e7df}.recipe-row small{display:block;color:#66756b}.recipe-row button{margin-left:5px;padding:8px 10px;border:0;border-radius:20px}.status{padding:10px 0;white-space:pre-wrap}@media(max-width:600px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}.manager{padding:12px}}</style></head><body><main class="manager"><a href="./">← Cookipie website</a><h1>Recipe Manager</h1><p>Add or edit a recipe here. Only the configured admin account can save public recipes.</p><div id="status" class="status" role="status">Checking your account…</div><section class="panel"><h2 id="formTitle">Add recipe</h2><form id="recipeForm"><div class="fields">
<label>Recipe ID (English, no spaces)<input name="id" required pattern="[a-z0-9-]+" placeholder="e.g. aloo-paratha"></label>
<label>English name<input name="name" required maxlength="120"></label><label>Hindi name<input name="hi" required maxlength="120"></label>
<label>Type<select name="kind"><option value="veg">Vegetarian</option><option value="nonveg">Non-vegetarian</option></select></label><label>Time in minutes<input name="time" type="number" min="1" max="600" value="30" required></label><label>Servings<input name="servings" type="number" min="1" max="100" value="2" required></label>
<label>Difficulty<select name="difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label><label>Categories (comma-separated)<input name="groups" placeholder="veg, breakfast, quick"></label>
<label class="wide">Dish image URL (HTTPS)<input name="image" type="url" required placeholder="https://…"></label><label class="wide">Image description<input name="alt" maxlength="250"></label>
<label class="wide">Search keywords<input name="tags" maxlength="1000"></label><label class="wide">English introduction<textarea name="intro" rows="2"></textarea></label><label class="wide">Hindi introduction<textarea name="introHi" rows="2"></textarea></label>
<label class="wide">Ingredients (one per line: English | Hindi)<textarea name="ingredients" rows="5" required placeholder="2 potatoes | 2 आलू&#10;Salt | नमक"></textarea></label>
<label class="wide">Steps (one per line: English | Hindi)<textarea name="steps" rows="6" required placeholder="Boil potatoes | आलू उबालें&#10;Mash and season | मैश करके मसाले मिलाएँ"></textarea></label>
<label class="wide">Cook’s tips (one per line: English | Hindi)<textarea name="tip" rows="2"></textarea></label></div><div class="buttons"><button type="submit">Save recipe</button><button type="button" class="secondary" id="clearForm">Clear form</button></div></form></section><section class="panel"><h2>Published recipes</h2><div id="recipeList">Loading…</div></section></main><script src="assets/js/auth.js?v=2"></script><script>
(()=>{const $=s=>document.querySelector(s),form=$("#recipeForm"),status=$("#status"),list=$("#recipeList");let recipes=[];const say=t=>status.textContent=t;function api(path,opts={}){return window.COOKIPIE_AUTH.ready.then(async()=>{const s=await window.COOKIPIE_AUTH.getSession();const base=location.hostname.endsWith("github.io")?"https://cookipie-github-io.uplakshapanwar.workers.dev":"";const r=await fetch(base+path,{...opts,headers:{"Content-Type":"application/json",...(s?.access_token?{Authorization:"Bearer "+s.access_token}:{})}});const d=await r.json();if(!r.ok)throw Error(d.error||"request_failed");return d})}function pairs(lines){return lines.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean).map(x=>{const p=x.split("|");return [p[0].trim(),(p[1]||p[0]).trim()]})}function fill(r){form.elements.id.value=r.id;form.elements.id.readOnly=true;for(const k of ["name","hi","kind","time","servings","difficulty","image","alt","tags","intro"])form.elements[k].value=r[k]??"";form.elements.groups.value=(r.groups||[]).join(", ");form.elements.introHi.value=r.introHi||r.intro_hi||"";form.elements.ingredients.value=(r.ingredients||[]).map(x=>Array.isArray(x)?x.join(" | "):x).join("\\n");form.elements.steps.value=(r.steps||[]).map(x=>Array.isArray(x)?x.join(" | "):x).join("\\n");form.elements.tip.value=(r.tip||[]).map(x=>Array.isArray(x)?x.join(" | "):x).join("\\n");$("#formTitle").textContent="Edit recipe: "+r.name;window.scrollTo({top:0,behavior:"smooth"})}function clear(){form.reset();form.elements.id.readOnly=false;form.elements.time.value=30;form.elements.servings.value=2;$("#formTitle").textContent="Add recipe"}function render(){list.innerHTML="";if(!recipes.length){list.textContent="No added recipes yet.";return}for(const r of recipes){const row=document.createElement("div");row.className="recipe-row";const info=document.createElement("div"),name=document.createElement("strong"),sub=document.createElement("small");name.textContent=r.name+" / "+r.hi;sub.textContent=r.id+" • "+r.time+" min";info.append(name,sub);const actions=document.createElement("div"),edit=document.createElement("button"),del=document.createElement("button");edit.textContent="Edit";edit.onclick=()=>fill(r);del.textContent="Delete";del.onclick=async()=>{if(!confirm("Delete "+r.name+" from the public collection?"))return;try{await api("/api/recipes-admin",{method:"DELETE",body:JSON.stringify({id:r.id})});say("Recipe deleted.");await load()}catch(e){say("Could not delete: "+e.message)}};actions.append(edit,del);row.append(info,actions);list.append(row)}}async function load(){try{const d=await api("/api/recipes-admin?action=admin");recipes=d.recipes||[];render();say("Signed in and authorized. You can manage public recipes.")}catch(e){say(e.message==="admin_only"?"This Google account is not on the Cookipie admin allowlist. Configure COOKIPIE_ADMIN_EMAILS in Cloudflare.":e.message==="login_required"?"Please sign in with your authorized Google account, then reload.":"Could not load recipes: "+e.message)}}form.addEventListener("submit",async e=>{e.preventDefault();const f=form.elements;const recipe={id:f.id.value.trim().toLowerCase(),name:f.name.value.trim(),hi:f.hi.value.trim(),kind:f.kind.value,time:Number(f.time.value),servings:Number(f.servings.value),difficulty:f.difficulty.value,groups:f.groups.value.split(",").map(x=>x.trim()).filter(Boolean),image:f.image.value.trim(),alt:f.alt.value.trim(),tags:f.tags.value.trim(),intro:f.intro.value.trim(),introHi:f.introHi.value.trim(),ingredients:pairs(f.ingredients.value),steps:pairs(f.steps.value),tip:pairs(f.tip.value)};try{await api("/api/recipes-admin",{method:"POST",body:JSON.stringify({recipe})});say("Saved. Refresh the public website to see the recipe.");clear();await load()}catch(e){say("Save failed: "+e.message)}});$("#clearForm").onclick=clear;document.addEventListener("cookipie-auth-ready",load,{once:true});setTimeout(()=>{if(window.COOKIPIE_AUTH)load()},900)})();
</script></body></html>
