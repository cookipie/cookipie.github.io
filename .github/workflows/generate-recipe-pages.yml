name: Generate recipe pages
on:
  push:
    branches: [main]
    paths:
      - "assets/js/recipes.js"
      - "assets/js/recipes-extra.js"
      - "recipes/**"
      - "sitemap.xml"
      - "scripts/generate-recipe-pages.mjs"
      - ".github/workflows/generate-recipe-pages.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate one page per recipe and update sitemap
        run: node scripts/generate-recipe-pages.mjs
      - name: Commit generated pages when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate recipe pages [skip recipe generation]"
            git push
          fi
